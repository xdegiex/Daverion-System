<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="Daverion System – platforma zarządzania produkcją MES · QHSE · Lean" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <title>Daverion System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800&family=Roboto:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-theme="dark">

  <div id="offline-banner" class="offline-banner">TRYB OFFLINE – praca lokalna · synchronizacja po powrocie sieci</div>

  <div id="gate-screen">
    <div class="gate-logo">D</div>
    <div class="gate-title">DAVERION</div>
    <form class="gate-form" id="gate-form">
      <input type="password" id="gate-pass" placeholder="••••" autocomplete="off" maxlength="20" />
      <button type="submit">WEJDŹ DO SYSTEMU</button>
      <div class="gate-error" id="gate-error"></div>
    </form>
  </div>

  <div id="app">
    <header class="topbar">
      <button class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
      <button class="logo-btn" id="logo-btn" title="Logowanie">D</button>
      <div class="app-title">Daverion</div>
      <div class="live-clock" id="live-clock">
        <span class="clock-time" id="clock-time">--:--:--</span>
        <span class="clock-date" id="clock-date">—</span>
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-right">
        <span id="sync-badge" style="display:none;" title="Status synchronizacji">●</span>
        <button class="theme-quick" id="theme-quick" title="Motyw">◐</button>
        <div class="alert-dot" id="alert-dot" title="Aktywna awaria"></div>
        <span class="user-badge" id="user-badge">Gość</span>
      </div>
    </header>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <a class="footer-link" id="footer-link">Black Baron System</a>
      </div>
    </aside>

    <div class="content-wrap">
      <main class="main-content" id="main-content"></main>
      <footer class="app-footer">
        <span>Daverion System © 2026 · Connected Factory Platform</span>
      </footer>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-content"></div>
  </div>
  <div id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
    function updateOfflineBanner() {
      const b = document.getElementById('offline-banner');
      if (b) b.classList.toggle('show', !navigator.onLine);
    }
    window.addEventListener('online', updateOfflineBanner);
    window.addEventListener('offline', updateOfflineBanner);
    updateOfflineBanner();

    (function liveClock() {
      const days = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
      const months = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
      function tick() {
        const n = new Date();
        const t = document.getElementById('clock-time');
        const d = document.getElementById('clock-date');
        if (t) t.textContent = n.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        if (d) d.textContent = days[n.getDay()] + ', ' + n.getDate() + ' ' + months[n.getMonth()] + ' ' + n.getFullYear();
      }
      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
